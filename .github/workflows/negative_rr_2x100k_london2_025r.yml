name: Negative RR 2x100k London two-window 0.25R
on:
  push:
    paths:
      - 'negative_rr_2x100k_london2_025r.py'
      - '.github/workflows/negative_rr_2x100k_london2_025r.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install dukascopy-node
      - run: node eurusd_multihour_download.js
      - run: pip install pandas numpy
      - run: python negative_rr_2x100k_london2_025r.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add negative_rr_2x100k_london2_025r_results.csv
          git commit -m 'Add London two-window negative RR results' || exit 0
          git push
