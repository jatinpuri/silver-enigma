name: Pair optimisation
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install numpy pandas requests numba
      - run: python optimizer.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pair_optimisation_top.csv pair_optimisation_best.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add pair optimisation results"
            git push
          fi
