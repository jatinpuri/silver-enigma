name: Build XAUUSD M1 BidAsk Artifact
on: [push]
permissions:
  contents: read
jobs:
  build-xauusd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Fetch source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kevingtlin/Market-Data-Lab.git source
          cd source
          git sparse-checkout set xauusd/bid/m1 xauusd/ask/m1
          git rev-parse HEAD > ../SOURCE_COMMIT.txt
      - name: Build parquet
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import pandas as pd
          import pyarrow as pa
          import pyarrow.parquet as pq

          src = Path("source/xauusd")
          out = Path("out")
          out.mkdir(exist_ok=True)
          bids = sorted((src/"bid"/"m1").glob("xauusd_bid_m1_20*.csv"))
          asks = {p.name.replace("xauusd_ask_",""):p for p in (src/"ask"/"m1").glob("xauusd_ask_m1_20*.csv")}
          target = out/"XAUUSD_M1_BIDASK_2010_2026-08.parquet"
          writer = None
          manifest = []
          total = 0
          first_ts = None
          last_ts = None

          for bp in bids:
              key = bp.name.replace("xauusd_bid_","")
              ap = asks.get(key)
              if ap is None:
                  continue
              b = pd.read_csv(bp).rename(columns={"open":"bid_open","high":"bid_high","low":"bid_low","close":"bid_close"})
              a = pd.read_csv(ap).rename(columns={"open":"ask_open","high":"ask_high","low":"ask_low","close":"ask_close"})
              m = b.merge(a,on="timestamp",how="inner",sort=True)[
                  ["timestamp","bid_open","bid_high","bid_low","bid_close","ask_open","ask_high","ask_low","ask_close"]
              ]
              if m.empty:
                  continue
              m["timestamp"] = m["timestamp"].astype("int64")
              table = pa.Table.from_pandas(m,preserve_index=False)
              if writer is None:
                  writer = pq.ParquetWriter(target,table.schema,compression="zstd",compression_level=9,use_dictionary=False,write_statistics=True)
              writer.write_table(table,row_group_size=250000)
              n = len(m)
              total += n
              fts = int(m["timestamp"].iloc[0])
              lts = int(m["timestamp"].iloc[-1])
              first_ts = fts if first_ts is None else min(first_ts,fts)
              last_ts = lts if last_ts is None else max(last_ts,lts)
              manifest.append([key,bp.name,ap.name,len(b),len(a),n,fts,lts])
              print(key,n,flush=True)

          if writer:
              writer.close()

          with (out/"manifest.csv").open("w",newline="") as fh:
              w=csv.writer(fh)
              w.writerow(["month_key","bid_file","ask_file","bid_rows","ask_rows","merged_rows","first_timestamp_ms","last_timestamp_ms"])
              w.writerows(manifest)

          commit=Path("SOURCE_COMMIT.txt").read_text().strip()
          first_iso=pd.to_datetime(first_ts,unit="ms",utc=True).isoformat()
          last_iso=pd.to_datetime(last_ts,unit="ms",utc=True).isoformat()
          lines=[
              "XAUUSD M1 BID/ASK DATASET",
              "",
              "Source: Dukascopy historical XAUUSD data packaged by kevingtlin/Market-Data-Lab",
              "Source repository: https://github.com/kevingtlin/Market-Data-Lab",
              f"Source commit: {commit}",
              "Resolution: 1 minute",
              "Timezone: UTC",
              f"Coverage: {first_iso} through {last_iso}",
              f"Merged rows: {total:,}",
              "Merge rule: inner join on timestamp",
              "",
              "Columns: timestamp,bid_open,bid_high,bid_low,bid_close,ask_open,ask_high,ask_low,ask_close",
              "",
              "Execution: long entries trigger on Ask and exit on Bid; short entries trigger on Bid and exit on Ask.",
              "For the ORB: whichever pending stop is touched first activates; cancel the opposite stop immediately."
          ]
          (out/"README.txt").write_text("\n".join(lines)+"\n")
          PY
      - name: Run first-touch ORB backtest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, math
          import numpy as np
          import pandas as pd

          data_path=Path("out/XAUUSD_M1_BIDASK_2010_2026-08.parquet")
          out=Path("out")
          df=pd.read_parquet(data_path).sort_values("timestamp").reset_index(drop=True)

          ts=df["timestamp"].to_numpy(dtype=np.int64)
          bo=df["bid_open"].to_numpy(float); bh=df["bid_high"].to_numpy(float)
          bl=df["bid_low"].to_numpy(float); bc=df["bid_close"].to_numpy(float)
          ao=df["ask_open"].to_numpy(float); ah=df["ask_high"].to_numpy(float)
          al=df["ask_low"].to_numpy(float); ac=df["ask_close"].to_numpy(float)

          bucket=(ts//900000)*900000
          starts=np.r_[0,np.flatnonzero(bucket[1:]!=bucket[:-1])+1]
          ends=np.r_[starts[1:],len(ts)]
          bt=bucket[starts]

          mbo=bo[starts]; mbc=bc[ends-1]
          mbh=np.maximum.reduceat(bh,starts); mbl=np.minimum.reduceat(bl,starts)
          mao=ao[starts]; mac=ac[ends-1]
          mah=np.maximum.reduceat(ah,starts); mal=np.minimum.reduceat(al,starts)

          # Remove synthetic closed-market 15m bars. Gold virtually never has a
          # genuine active 15m bar with zero movement on both Bid and Ask.
          flat=(mbo==mbh)&(mbo==mbl)&(mbo==mbc)&(mao==mah)&(mao==mal)&(mao==mac)
          keep=~flat
          bt=bt[keep]; mbo=mbo[keep]; mbh=mbh[keep]; mbl=mbl[keep]; mbc=mbc[keep]
          mao=mao[keep]; mah=mah[keep]; mal=mal[keep]; mac=mac[keep]

          prev=np.r_[mbc[0],mbc[:-1]]
          tr=np.maximum.reduce([mbh-mbl,np.abs(mbh-prev),np.abs(mbl-prev)])
          atr=np.full(len(tr),np.nan)
          if len(tr)>=14:
              atr[13]=tr[:14].mean()
              for i in range(14,len(tr)):
                  atr[i]=(atr[i-1]*13+tr[i])/14

          dt=pd.to_datetime(bt,unit="ms",utc=True)
          dow=dt.dayofweek.to_numpy()
          hour=dt.hour.to_numpy()
          minute=dt.minute.to_numpy()

          slots=[("00:45",0,45),("05:15",5,15),("07:45",7,45),("13:15",13,15)]
          trades=[]
          ambiguous_entries=0
          ambiguous_exits=0

          for slot,hh,mm in slots:
              refs=np.flatnonzero((dow<5)&(hour==hh)&(minute==mm)&np.isfinite(atr))
              for ri in refs:
                  ref_t=int(bt[ri])
                  ref_high=float(mbh[ri]); ref_low=float(mbl[ri])
                  a=float(atr[ri])
                  if a<=0 or ref_high<=ref_low:
                      continue
                  start_t=ref_t+15*60_000
                  expiry=ref_t+120*60_000
                  j0=int(np.searchsorted(ts,start_t,"left"))
                  j1=int(np.searchsorted(ts,expiry,"left"))
                  if j0>=j1:
                      continue

                  side=0; entry_i=None; entry_price=None; amb=False
                  for j in range(j0,j1):
                      hit_buy=ah[j]>=ref_high
                      hit_sell=bl[j]<=ref_low
                      if hit_buy or hit_sell:
                          if hit_buy and hit_sell:
                              ambiguous_entries+=1
                              trades.append({
                                  "ref_time_ms":ref_t,"slot":slot,"side":"AMBIG",
                                  "entry_time_ms":int(ts[j]),"entry_price":np.nan,"atr":a,
                                  "stop":np.nan,"target":np.nan,"exit_time_ms":int(ts[j]),
                                  "exit_price":np.nan,"reason":"AMBIG_ENTRY_LOSS","r":-1.0
                              })
                              amb=True
                          elif hit_buy:
                              side=1; entry_i=j; entry_price=max(ref_high,float(ao[j]))
                          else:
                              side=-1; entry_i=j; entry_price=min(ref_low,float(bo[j]))
                          break
                  if amb or side==0:
                      continue

                  risk=1.5*a
                  stop=entry_price-side*risk
                  target=entry_price+side*1.5*risk
                  exit_i=None; exit_price=None; reason=None

                  for k in range(entry_i,j1):
                      if side==1:
                          hs=bl[k]<=stop
                          ht=bh[k]>=target
                          if hs and ht:
                              ambiguous_exits+=1
                              exit_i=k
                              exit_price=min(stop,float(bo[k])) if bo[k]<=stop else stop
                              reason="AMBIG_EXIT_SL"
                              break
                          if hs:
                              exit_i=k
                              exit_price=min(stop,float(bo[k])) if bo[k]<=stop else stop
                              reason="SL"
                              break
                          if ht:
                              exit_i=k; exit_price=target; reason="TP"; break
                      else:
                          hs=ah[k]>=stop
                          ht=al[k]<=target
                          if hs and ht:
                              ambiguous_exits+=1
                              exit_i=k
                              exit_price=max(stop,float(ao[k])) if ao[k]>=stop else stop
                              reason="AMBIG_EXIT_SL"
                              break
                          if hs:
                              exit_i=k
                              exit_price=max(stop,float(ao[k])) if ao[k]>=stop else stop
                              reason="SL"
                              break
                          if ht:
                              exit_i=k; exit_price=target; reason="TP"; break

                  if exit_i is None:
                      exit_i=j1-1
                      exit_price=float(bc[exit_i] if side==1 else ac[exit_i])
                      reason="TIME"

                  r=(exit_price-entry_price)/risk if side==1 else (entry_price-exit_price)/risk
                  trades.append({
                      "ref_time_ms":ref_t,"slot":slot,"side":"LONG" if side==1 else "SHORT",
                      "entry_time_ms":int(ts[entry_i]),"entry_price":entry_price,"atr":a,
                      "stop":stop,"target":target,"exit_time_ms":int(ts[exit_i]),
                      "exit_price":exit_price,"reason":reason,"r":float(r)
                  })

          t=pd.DataFrame(trades).sort_values(["entry_time_ms","slot"]).reset_index(drop=True)
          t["ref_time_utc"]=pd.to_datetime(t["ref_time_ms"],unit="ms",utc=True)
          t["entry_time_utc"]=pd.to_datetime(t["entry_time_ms"],unit="ms",utc=True)
          t["exit_time_utc"]=pd.to_datetime(t["exit_time_ms"],unit="ms",utc=True)
          t["year"]=t["ref_time_utc"].dt.year
          t["weekday"]=t["ref_time_utc"].dt.day_name()

          def stats(x):
              r=x["r"].to_numpy(float)
              eq=np.cumsum(r)
              peak=np.maximum.accumulate(np.r_[0.0,eq])
              dd=peak[1:]-eq
              pos=r[r>0].sum()
              neg=-r[r<0].sum()
              return {
                  "trades":int(len(r)),
                  "win_rate":float((r>0).mean()) if len(r) else None,
                  "ev_r":float(r.mean()) if len(r) else None,
                  "profit_factor":float(pos/neg) if neg>0 else None,
                  "total_r":float(r.sum()),
                  "max_dd_r":float(dd.max()) if len(dd) else 0.0
              }

          summary={"overall":stats(t),"ambiguous_entries":ambiguous_entries,"ambiguous_exits":ambiguous_exits}
          summary["extra_cost_sensitivity"]={}
          for cost in [0.005,0.01,0.02]:
              x=t.copy(); x["r"]=x["r"]-cost
              summary["extra_cost_sensitivity"][str(cost)]=stats(x)

          yearly=[]
          for y,g in t.groupby("year"):
              d={"year":int(y),**stats(g)}
              yearly.append(d)
          slots_out=[]
          for s,g in t.groupby("slot"):
              d={"slot":s,**stats(g)}
              slots_out.append(d)
          year_slot=[]
          for (y,s),g in t.groupby(["year","slot"]):
              year_slot.append({"year":int(y),"slot":s,**stats(g)})

          (out/"orb_m1_summary.json").write_text(json.dumps(summary,indent=2))
          pd.DataFrame(yearly).to_csv(out/"orb_m1_yearly.csv",index=False)
          pd.DataFrame(slots_out).to_csv(out/"orb_m1_slots.csv",index=False)
          pd.DataFrame(year_slot).to_csv(out/"orb_m1_year_slot.csv",index=False)
          t.to_csv(out/"orb_m1_trades.csv",index=False)
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_M1_BIDASK_2010_2026-08
          path: |
            out/XAUUSD_M1_BIDASK_2010_2026-08.parquet
            out/manifest.csv
            out/README.txt
            out/orb_m1_summary.json
            out/orb_m1_yearly.csv
            out/orb_m1_slots.csv
            out/orb_m1_year_slot.csv
            out/orb_m1_trades.csv
          compression-level: 0
          retention-days: 7
