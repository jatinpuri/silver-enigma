name: Setup B dual-regime 200k 2026
on:
  push:
    paths:
      - 'setup_b_dual_regime_200k_2026.py'
      - '.github/workflows/setup_b_dual_regime_200k_2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install dukascopy-node
      - run: node eurusd_multihour_download.js
      - run: pip install pandas numpy
      - run: python setup_b_dual_regime_200k_2026.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add setup_b_dual_regime_200k_2026_results.csv setup_b_dual_regime_2026_summary.csv setup_b_dual_regime_2026_trades.csv
          git commit -m 'Add 2026 dual-regime Setup B 200k results' || exit 0
          git push
