name: Setup B extra setups optimizer
on:
  push:
    paths:
      - 'setup_b_extra_setups_optimizer.py'
      - 'setup_b_extra_setups_optimizer_fixed.py'
      - '.github/workflows/setup_b_extra_setups_optimizer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install dukascopy-node
      - run: node eurusd_multihour_download.js
      - run: pip install pandas numpy
      - run: python setup_b_extra_setups_optimizer_fixed.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase
          git add setup_b_extra_setups_all_candidates.csv setup_b_extra_setups_strict_candidates.csv setup_b_extra_setups_selected.csv setup_b_extra_setups_portfolio_summary.csv setup_b_extra_setups_portfolio_trades.csv setup_b_extra_setups_base_summary.csv
          git commit -m 'Add extra London setup optimizer results' || exit 0
          git push
