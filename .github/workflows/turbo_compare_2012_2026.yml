name: Turbo compare 2012-2026

on:
  push:
    paths:
      - 'turbo_200k_08pct_1trade_day_compare_2012_2026.py'
      - '.github/workflows/turbo_compare_2012_2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python turbo_200k_08pct_1trade_day_compare_2012_2026.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turbo_compare_2012_2026_*.csv
          git commit -m "Add 2012-2026 Turbo comparison results" || exit 0
          git push
