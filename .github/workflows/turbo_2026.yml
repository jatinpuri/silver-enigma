name: Turbo 2026 funded simulation
on:
  push:
    paths:
      - 'turbo_2026_sim.py'
      - '.github/workflows/turbo_2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python turbo_2026_sim.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turbo_2026_summary.csv turbo_2026_payouts.csv turbo_2026_breaches.csv
          git diff --cached --quiet || git commit -m "Add 2026 Turbo funded simulation results"
          git pull --rebase origin master
          git push
