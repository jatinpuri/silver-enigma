name: Setup B ADX falling variants
on:
  push:
    paths:
      - 'setup_b_adx_falling_variants.py'
      - '.github/workflows/setup_b_adx_falling_variants.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install dukascopy-node
      - run: node eurusd_multihour_download.js
      - run: pip install pandas numpy
      - run: python setup_b_adx_falling_variants.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add setup_b_adx_falling_variants_results.csv setup_b_adx_falling_variant_trades.csv
          git commit -m 'Add ADX falling variant results' || exit 0
          git push
