name: Turbo 200k 1pct one trade day
on:
  push:
    paths:
      - 'turbo_200k_1pct_1trade_day.py'
      - '.github/workflows/turbo_200k_1pct_1trade_day.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python turbo_200k_1pct_1trade_day.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turbo_200k_1pct_1trade_day_summary.csv turbo_200k_1pct_1trade_day_payouts.csv turbo_200k_1pct_1trade_day_breaches.csv turbo_200k_1pct_1trade_day_trades.csv
          git diff --cached --quiet || git commit -m "Add one-trade-per-day Turbo 2026 results"
          git pull --rebase origin master
          git push
