name: Turbo 200k 0.8pct one trade day buffer4k 2025
on:
  push:
    paths:
      - 'turbo_200k_08pct_1trade_day_buffer4k_2025.py'
      - '.github/workflows/turbo_200k_08pct_1trade_day_buffer4k_2025.yml'
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python turbo_200k_08pct_1trade_day_buffer4k_2025.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turbo_200k_08pct_1trade_day_buffer4k_2025_*.csv
          git commit -m "Add 2025 Turbo 4k buffer results" || exit 0
          git pull --rebase origin master
          git push
